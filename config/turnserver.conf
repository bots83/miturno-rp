# coturn 4.6.1 (paquete de Ubuntu 24.04) del servidor de video de MiTurno: TURN para el WebRTC de
# WHEP (MediaMTX), con credenciales efímeras que emite la api del servidor principal.
#
# Plantilla SIN secretos: desplegar-video.sh (repo principal) le agrega al final la línea
# static-auth-secret, leída de /etc/miturno-video/turn.secret, y la instala como /etc/turnserver.conf
# (640 root:turnserver; coturn 4.6.1 no sabe leer el secreto de un archivo aparte).
#
# Credenciales (esquema REST de coturn): usuario "<vencimiento unix>:<id de usuario>",
# clave base64(HMAC-SHA1(secreto, usuario)). Vencen junto con la credencial de turno.

# ---------------------------------------------------------------- escucha
# Solo la IP pública (Linode la tiene directo en eth0: no hace falta external-ip) y solo IPv4.
listening-ip=172.237.53.111
relay-ip=172.237.53.111
listening-port=3478
tls-listening-port=5349
# Sin descubrimiento de NAT de RFC 5780 (pide una segunda IP y puertos alternativos).
no-rfc5780
no-stun-backward-compatibility
# Rango de relé UDP acotado (el mismo que abre ufw).
min-port=49160
max-port=49200

# ---------------------------------------------------------------- autenticación
realm=sp.miturnolive.com
server-name=sp.miturnolive.com
use-auth-secret
# (static-auth-secret=… lo agrega desplegar-video.sh; acá no va.)
# Sin usuarios fijos: nada de lt-cred-mech ni user=.
# Un nonce dura 10 minutos.
stale-nonce=600
# Topes: una persona usa pocas asignaciones (varias candidatas de ICE); en F1 solo el operador.
user-quota=12
total-quota=60
# Sin consola de administración y sin listas ni realms dinámicos desde la base (la de sqlite que
# crea el paquete queda vacía y sin uso).
no-cli
no-dynamic-ip-list
no-dynamic-realms
# STUN también con FINGERPRINT (lo pide WebRTC).
fingerprint
# No dice qué versión de servidor corre.
no-software-attribute

# ---------------------------------------------------------------- TLS (5349 por TCP)
# Copias del certificado de Let's Encrypt que obtiene Caddy (miturno-turn-cert las mantiene al día).
cert=/etc/coturn/tls/sp.miturnolive.com.crt
pkey=/etc/coturn/tls/sp.miturnolive.com.key
no-tlsv1
no-tlsv1_1
# TLS 1.2 solo con ECDHE y cifrado autenticado (GCM o ChaCha20-Poly1305): sin CBC ni SHA-1. Las dos
# variantes (ECDSA y RSA) sirven para cualquier tipo de certificado que saque Caddy. Comprobado con
# `openssl ciphers -v`. Se verifica en vivo con `openssl s_client -connect sp.miturnolive.com:5349
# -tls1_2 -cipher ECDHE-RSA-AES128-SHA` (tiene que fallar el handshake).
cipher-list=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
# Sin DTLS: 5349 es solo TLS sobre TCP (ufw no abre 5349/udp).
no-dtls

# ---------------------------------------------------------------- no es un relé abierto
# El único destino permitido es la propia IP pública del servidor de video (MediaMTX, WebRTC).
# coturn evalúa allowed-peer-ip como excepción de denied-peer-ip: todo lo demás se rechaza con 403.
# coturn no filtra por puerto: que hacia esa IP el relé solo entregue en 8189 (MediaMTX) lo impone
# el firewall de salida miturno-turn.nft (miturno-turn-nft.service, que coturn requiere).
allowed-peer-ip=172.237.53.111
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Por si alguna vez se toca la línea de arriba: los rangos privados, reservados y de servicio, explícitos.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers
# Solo relé UDP (WebRTC): sin TCP hacia los destinos (RFC 6062).
no-tcp-relay

# ---------------------------------------------------------------- registro
# Al journal (con su propia rotación), en el formato corto.
syslog
simple-log
