# Configuración de miturno-rp (sin secretos). Se instala en /etc/miturno-video/rp.toml.
# El nombre de la conexión de casa va en /etc/miturno-video/casa.env (PS5_HOST) y la registración
# de la consola en /etc/miturno-video/ps5.env (PS5_REGIST_KEY, PS5_MORNING, PS5_ACCOUNT_ID; 600 root).
bitrate_kbps = 8000
salida_udp = "127.0.0.1:9000"
http = "127.0.0.1:7070"
cartel = "/var/lib/miturno-video/cartel.ts"
clave_publica = "/etc/miturno-video/ct-public.pem"
token_control = "/etc/miturno-video/control.token"
# Pausa del ciclo (consola tomada o reposo), para que un reinicio no retome la consola. Es el
# StateDirectory de miturno-rp.service.
pausa = "/var/lib/miturno-rp/pausa"
# Registro de las sesiones WHEP abiertas (sin secretos), para expulsarlas aunque miturno-rp se
# reinicie. Va en el mismo StateDirectory; si falta, es este valor.
# sesiones_whep = "/var/lib/miturno-rp/whep.json"
# Veredicto del vigilante de imagen (miturno-vigia), para la salud. Si falta, la salud manda vigia: null.
vigia_estado = "/run/miturno-vigia-estado/estado.json"
