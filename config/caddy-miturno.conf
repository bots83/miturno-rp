# Drop-in de MiTurno para el caddy.service del paquete de Ubuntu. Se instala en
# /etc/systemd/system/caddy.service.d/50-miturno.conf con scripts/video/desplegar-video.sh.
#
# - La API de administración de Caddy va por un socket unix en /run/caddy (0700, solo caddy y
#   root): por TCP (localhost:2019) cualquier usuario local, incluidos rp y mediamtx, podía
#   reconfigurar el 443 público. El Caddyfile dice "admin unix//run/caddy/admin.sock" y
#   `systemctl reload caddy` (ExecReload: caddy reload, como usuario caddy) usa ese mismo socket.
# El otro drop-in de Caddy, 50-miturno-procesos.conf (ProtectProc=invisible, para que no vea la línea
# de comandos de ffmpeg de kick-out), lo genera el mismo script para todos los servicios de la lista
# SIN_VER_PROCESOS.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
